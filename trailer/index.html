<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WaveFern Records – Trailer</title><meta name="robots" content="noindex"><style>html,body{margin:0;background:#0c0f0d;color:#8aa094;font:15px system-ui,sans-serif}</style></head>
<body><p style="padding:24px">Loading the trailer…</p>
<script>/* v49.4.0: wavefern.com/trailer loads the game itself in trailer mode (175-trailer.js), so the address stays /trailer.
   The game page is read from the site root and written into this page with a base address of the root, so all its files load as normal. */
(function(){var root=new URL('../',location.href).href;
fetch(root+'index.html',{cache:'no-cache'}).then(function(r){return r.text()}).then(function(h){
 h=h.replace(/<head>/i,'<head><base href="'+root+'"><script>window.FW_TRAILER=1<\/script>');document.open();document.write(h);document.close()})
.catch(function(){location.replace(root+'?trailer')})})();</script></body></html>
