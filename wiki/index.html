<!--pages--><noscript><nav style="padding:16px" aria-label="All wiki pages"><h2>All wiki pages</h2><h3><a href="/wiki/cat-start/">Getting started</a></h3><ul><li><a href="/wiki/first-day/">Your first day</a>: You start as an unknown artist with $100, a starter house with a tiny studio and a laptop. The goal: record songs, release them on Spotifly, and grow from nobody to a global star.[1]</li><li><a href="/wiki/controls/">Controls</a>: WaveFern plays with a keyboard and mouse, or with touch controls on phones and tablets.[1]</li><li><a href="/wiki/days/">Days, time and energy</a>: A full in-game day lasts 12 real minutes, from 06:00 to 06:00 the next morning. About nine songs fit in one day.[1]</li><li><a href="/wiki/faq/">Frequently asked questions</a>: Short answers to common questions. Each one links to the page with the full details.</li></ul><h3><a href="/wiki/cat-music/">Music</a></h3><ul><li><a href="/wiki/recording/">Recording a song</a>: The Make a song screen and the three minigames: Beat, Lyrics and Mix.</li><li><a href="/wiki/song-quality/">Song quality</a>: Every song gets a quality score. Quality drives almost everything: daily Streams, the chance of a hit, Park Fields Festival crowds and Gramophone Awards.[1]</li><li><a href="/wiki/genres/">Genres and genre focus</a>: The nine genres, their families, beat styles, hype and the genre focus bonus.</li><li><a href="/wiki/extras/">Extras: sub-genres, diss tracks, 808s and hi hats</a>: Open Extras on the Make a song screen to choose a sub-genre, a diss track, your 808 and your hi hats.[1]</li><li><a href="/wiki/streams/">Streams</a>: The full daily streams formula, decay, caps, hits and viral songs.</li><li><a href="/wiki/listeners/">Monthly listeners and followers</a>: Monthly listeners are the headline number: they set your Fame levels level, who DMs you, which Record labels want you, and how big your Park Fields Festival crowds are.[1]</li><li><a href="/wiki/albums/">Albums</a>: Once you have at least two released songs you can bundle them into an album from Spotifly. Pick the tracks, the order, a title and cover art.[1]</li><li><a href="/wiki/collabs/">Collabs, fees and haggling</a>: A collab is a song with another artist. You either pay them (you messaged them) or they pay you (they messaged you). Their fans come along: a featured song gets about 1% of their monthly listeners in extra streams each day.[1]</li><li><a href="/wiki/promotions/">Promotions</a>: Paid campaigns that multiply a song's streams for a few days.</li><li><a href="/wiki/halo/">Catalogue halo</a>: When your listeners balloon, some of them dig into your older songs.</li><li><a href="/wiki/spotifly/">Spotifly</a>: Spotifly is where your music lives. Open it on the laptop (or the Spotifly app on your phone).[1]</li><li><a href="/wiki/song-audio/">How Spotifly songs sound</a>: How the game makes a playable track for every song you record.</li></ul><h3><a href="/wiki/cat-career/">Career</a></h3><ul><li><a href="/wiki/money/">Money</a>: You start with $100. Most of your income comes from streams, paid every morning.[1]</li><li><a href="/wiki/gear/">Studio gear</a>: Every piece of studio gear, its levels, prices and what it adds.</li><li><a href="/wiki/fame/">Fame levels</a>: Your fame level comes from your monthly listeners. Jewellery makes you look more famous: each piece adds 8%.[1]</li><li><a href="/wiki/mentors/">Mentors</a>: There are 5 mentors, each inspired by a music legend. One unlocks each time you reach the next monthly listener milestone, and every mentor adds +2 quality to every song (and 8 experience). Meet them on the laptop under Legends.[1]</li><li><a href="/wiki/labels/">Record labels</a>: Labels message you with an offer when your monthly listeners, total streams and reputation all reach their thresholds. Signing pays an advance up front; from then on the label keeps a cut of your streaming income every night.[1]</li><li><a href="/wiki/quests/">Quests</a>: The Quests app (preinstalled on the laptop) gives you 3 daily quests and 3 weekly quests. Finish the whole set to get paid. Quests are rolled once and saved, so reloading never changes them.[1]</li><li><a href="/wiki/awards/">Gramophone Awards</a>: The awards hall stands at the end of your street. From Fame Level 225 you can check in (once every 15 days), submit one song, and watch the ceremony.[1]</li><li><a href="/wiki/reputation/">Reputation</a>: Reputation is a hidden score that starts at 0.[1]</li><li><a href="/wiki/rivals/">Rivals</a>: You can make a diss track about any of these rivals.[1]</li><li><a href="/wiki/radio/">Radio and TV</a>: The Radio Station sells airtime. Each slot raises interest (which lifts every song's daily streams) and brings followers.[1]</li><li><a href="/wiki/billboards/">Billboards</a>: Billboards beside the main roads rotate every 10 seconds through roster artists with 5,000+ monthly listeners. Once you reach 10,000 monthly listeners, your own name joins the rotation.[1]</li></ul><h3><a href="/wiki/cat-live/">Live and touring</a></h3><ul><li><a href="/wiki/festival/">Park Fields Festival</a>: The weekly festival: stages, crowds, pay and crowd minigames.</li><li><a href="/wiki/festival-app/">FestivalApp and bookings</a>: FestivalApp is free and installed for you. Pick a festival, a stage your fame allows and a free slot.[1]</li><li><a href="/wiki/flights/">Flights and the airport</a>: Swiftwing is the game's airline. Book from the Swiftwing app (computer or Gphone) or at the ticket desk in any airport. Fernfield International is at the far west end of Fern Road.[1]</li><li><a href="/wiki/world-tour/">World Tour</a>: The World Tour app appears in the App Barn at Fame Level 275. It costs $250,000 once. Plan on its world map: click a continent, then a country, then add its stops, up to 5. Each stop gets a setlist (songs or a whole album). Then book Flights and the airport and fly there.[1]</li><li><a href="/wiki/tour-shows/">Stadium and club shows</a>: Rehearsing, production, talking to the crowd and the show score.</li><li><a href="/wiki/tour-cities/">Tour cities</a>: Walking around abroad: landmarks, hotels, street food and souvenirs.</li></ul><h3><a href="/wiki/cat-life/">City life</a></h3><ul><li><a href="/wiki/city/">The city and the map</a>: Your house sits on a quiet street west of the city. Press N for the map: scroll or +/− to zoom.[1]</li><li><a href="/wiki/cars/">Cars and the garage</a>: Book a car on motors.wf in the laptop browser, then visit Motors to pick it up. You need a garage first ($2,500), which appears beside your house once bought.[1]</li><li><a href="/wiki/homes/">Homes</a>: Book a viewing on homes.wf, then buy at the Property office. A home gives +3 to every song's quality and +10% reach on streams.[1]</li><li><a href="/wiki/furniture/">Furniture and storage</a>: Buy furniture on Amazoom (a $250 app). It arrives in Storage. Some pieces move: the fish tank, the grandfather clock's pendulum, the lava lamp, the electric fireplace, the popcorn machine and the gaming PC's fans. At home press F to open Storage and build mode: place, move and rotate (R) pieces.[1]</li><li><a href="/wiki/paint/">Wall paint</a>: Repaint the walls of your home for $40 a colour.[1]</li><li><a href="/wiki/clothes/">Clothes (Threadz)</a>: Buy clothes on Threadz in the laptop browser and wear them from the wardrobe in your bedroom (E). Every piece comes in 24+ colours.[1]</li><li><a href="/wiki/barbershop/">Barbershop</a>: The Barbershop in the city restyles you. Classic cuts are $20 and a dye job is $15. Signature styles:[1]</li><li><a href="/wiki/pets/">Pets</a>: Book on pawfinder.wf, then pick up at the Pet Shop. You can keep up to 3. Each pet adds +1 to every song's quality. Pets can stay home or follow you around.[1]</li><li><a href="/wiki/bodyguards/">Bodyguards</a>: Book on bodyguards.wf and hire at Security. Guards unlock at Fame Level 34. You can have up to 3, and dismiss them or call them back.[1]</li><li><a href="/wiki/jewellery/">Jewellery</a>: Each piece bought at the Jewellery store adds 8% to your Fame levels value.[1]</li><li><a href="/wiki/fans/">Fans, autographs and robbery</a>: The more famous you are, the more people recognise you. A passer-by notices you with a chance of monthly listeners ÷ 5,000,000.[1]</li><li><a href="/wiki/food/">Food and energy</a>: Food refills energy. Drinks marked &quot;stamina&quot; also refill your sprint.[1]</li><li><a href="/wiki/gphone/">Gphone</a>: Press G to open your phone. You start with a laggy Gphone 8; newer models are sold on Amazoom. Every model has Messages, Spotifly, Instagrime, Eats, Gigs, Camera and Photos. Better models boost every song's streams and make photo posts bring more followers.[1]</li><li><a href="/wiki/instagrime/">Instagrime</a>: Instagrime is a $400 app. Post once a day for 2-8 new followers. Photos from your Gphone camera can be posted too, for more followers with a better phone. Promotions are bought here.[1]</li><li><a href="/wiki/apps/">Computer and apps</a>: Press E at your desk to use the laptop: Spotifly, the gear Shop, Legends (mentors), Messages, a web browser and the App Barn.[1]</li><li><a href="/wiki/messages/">Messages and Big Vee</a>: Messages holds every chat: artists who DM you (see Collabs, fees and haggling), label offers and Big Vee, your manager. Pin chats to keep them on top, clear them, or press New for suggested people.[1]</li></ul><h3><a href="/wiki/cat-band/">Multiplayer</a></h3><ul><li><a href="/wiki/band-rooms/">Band rooms</a>: Up to four friends in one band, how songs and sets work together.</li></ul><h3><a href="/wiki/cat-meta/">About the game</a></h3><ul><li><a href="/wiki/saves/">Saves and careers</a>: Two career slots, autosave, cloud saves, save codes and backups.</li><li><a href="/wiki/settings/">Settings and graphics</a>: Settings opens from the main menu or the pause menu. Under Graphics pick a preset or your own mix.[1]</li><li><a href="/wiki/versions/">Version history</a>: The game is on v49.28.0. This list is read live from the game, so it is always current.</li><li><a href="/wiki/about-wiki/">About this wiki</a>: This wiki is written from the game's own code. Every table that lists game data (gear, artists, cars, labels, stages, destinations, fame levels and more) is copied out of the running game by tools/wiki-data.js each time the site is published, so it can't fall behind.</li><li><a href="/wiki/secrets/">Secrets</a>: There is a secret code somewhere in WaveFern. What it is, where it goes and what it does is a mystery.</li><li><a href="/wiki/credits/">Credits</a>: WaveFern was made by James Hutchinson and Rowan Burton.</li><li><a href="/wiki/contact/">Contact</a>: Found a bug, got an idea, or just want to say something? Send a message to the people who make WaveFern.</li></ul></nav></noscript><!--/pages-->
