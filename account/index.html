<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your WaveFern account</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<meta name="color-scheme" content="light dark">
<style>
/* v56.0.45: matches the sign-in emails (worker/mail.js): green pixel logo, Silkscreen heading and button, game monospace body, black button with a green offset shadow (green with a black one in dark mode). Only two fonts. Own solid background so text is always readable. */
:root{color-scheme:light dark;--bg:#fff;--ink:#161616;--t:#3a4540;--m:#6b7a72;--g:#2fe68a;--gs:#1d4a37;--lk:#178f55;--ln:#161616;--bad:#c0392b;--ok:#178f55;--bf:#161616;--bt:#fff;--bs:#2fe68a}
@media (prefers-color-scheme:dark){:root{--bg:#0c0f0d;--ink:#fff;--t:#e8f3ec;--m:#8aa094;--lk:#2fe68a;--ln:#444;--bad:#ff9b9b;--ok:#9dffc4;--bf:#2fe68a;--bt:#000;--bs:#000}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:40px 16px;background:var(--bg);color:var(--t);font:14px/1.75 ui-monospace,Menlo,Consolas,'Courier New',monospace;text-align:center}
.logo{font:700 40px/1 Silkscreen,'Courier New',monospace;letter-spacing:5px;color:var(--g);text-shadow:3px 3px 0 var(--gs);text-decoration:none}
main{width:100%;max-width:520px}
h1{margin:0 0 18px;font:700 22px/1.35 Silkscreen,'Courier New',monospace;letter-spacing:2px;color:var(--ink)}
p{margin:0 0 16px}.m{color:var(--m);font-size:12px}.bad{color:var(--bad)}.ok{color:var(--ok)}
input{width:100%;max-width:340px;margin:0 0 14px;padding:12px;font:inherit;color:var(--ink);background:transparent;border:2px solid var(--ln);border-radius:0}
input:focus{outline:2px solid var(--g);outline-offset:1px}
.btn{display:inline-block;min-width:240px;max-width:100%;margin:12px 5px 5px 0;padding:19px 24px 17px;font:700 17px/20px Silkscreen,'Courier New',monospace;letter-spacing:3px;text-transform:uppercase;text-align:center;text-decoration:none;color:var(--bt);background:var(--bf);border:0;border-radius:0;box-shadow:5px 5px 0 var(--bs);cursor:pointer}
.btn:hover{filter:brightness(1.15)}.btn:disabled{opacity:.5;cursor:default}
footer{font-size:11px;color:var(--m)}footer a{color:var(--m);white-space:nowrap}footer p{margin:8px 0 0}
</style></head><body>
<a class="logo" href="/">WAVEFERN</a>
<main id="m"><h1>One moment…</h1><p class="m">Checking your link.</p></main>
<footer><a href="/terms/">Terms of Service</a> &middot; <a href="/privacy/">Privacy Policy</a> &middot; <a href="/legal/">Legal</a> &middot; <a href="/wiki/contact/">Contact</a><p>WaveFern is a fictional music career game. &copy; 2026 WaveFern.</p></footer>
<script type="module">
/* v56.0.4: the page the emails link to. Same Firebase project and public web config as the game (86-google-signin.js). Reads the one-time code
   from the URL and confirms the email address or sets the new password. No secrets here. */
const FB_V='10.12.2',CFG={apiKey:'AIzaSyBK_7wiX2SEtEhacUsFrgt8URcG1DyHdmA',authDomain:'waveferndata.firebaseapp.com',projectId:'waveferndata',appId:'1:729312399087:web:09d5d134ce654e223ed51a'};
const q=new URLSearchParams(location.search),mode=q.get('mode'),code=q.get('oobCode'),box=document.getElementById('m');
history.replaceState(null,'',location.pathname);/* keep the one-time code out of the address bar and history */
const show=(h,t,cls)=>{box.innerHTML='';const e=document.createElement('h1');e.textContent=h;box.append(e);if(t){const p=document.createElement('p');p.textContent=t;if(cls)p.className=cls;box.append(p)}};
const play=()=>{const a=document.createElement('a');a.className='btn';a.href='/';a.textContent='Back to WaveFern';box.append(a)};
const bad=()=>{show('This link does not work','It may have been used already or it expired. Go back to the game and ask for a new email.','bad');play()};
(async()=>{
 if(!code||!/^(verifyEmail|resetPassword)$/.test(mode||''))return bad();
 const u='https://www.gstatic.com/firebasejs/'+FB_V+'/firebase-';
 const [a,m,ac]=await Promise.all([import(u+'app.js'),import(u+'auth.js'),import(u+'app-check.js').catch(()=>null)]);
 const app=a.initializeApp(CFG);try{ac&&ac.initializeAppCheck(app,{provider:new ac.ReCaptchaEnterpriseProvider('6Lcv_ycuAAAAAEB34hu7jkN3uogbbgyCDmun3DDm'),isTokenAutoRefreshEnabled:true})}catch(e){}
 const auth=m.getAuth(app);
 if(mode=='verifyEmail'){
  try{await m.applyActionCode(auth,code);show('Email confirmed','You are all set. Go back to WaveFern and press "I confirmed it" (or just reopen the game).','ok');play()}catch(e){bad()}
  return}
 let email;try{email=await m.verifyPasswordResetCode(auth,code)}catch(e){return bad()}
 show('Choose a new password');
 const who=document.createElement('p');who.className='m';who.textContent=email;
 const pw=document.createElement('input');pw.type='password';pw.autocomplete='new-password';pw.placeholder='New password (8+ characters)';pw.maxLength=128;
 const err=document.createElement('p');err.className='bad';
 const b=document.createElement('button');b.className='btn';b.textContent='Save password';
 const go=async()=>{err.textContent='';if(pw.value.length<8){err.textContent='Use at least 8 characters.';return}b.disabled=true;
  try{await m.confirmPasswordReset(auth,code,pw.value);show('Password saved','You can sign in to WaveFern with this email and your new password.','ok');play()}catch(e){b.disabled=false;if(e&&e.code=='auth/weak-password')err.textContent='Pick a stronger password.';else bad()}};
 b.onclick=go;pw.onkeydown=e=>{if(e.key=='Enter')go()};box.append(who,pw,err,b);pw.focus();
})().catch(bad);
</script></body></html>
